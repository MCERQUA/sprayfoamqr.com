<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Form Registration</title></head>
<body>
<!-- Netlify static form-detection decoy. Never linked in nav; registers all forms + fields. -->

<form name="contact" data-netlify="true" hidden>
  <input type="hidden" name="form-name" value="contact" />
  <input name="bot-field" />
  <input name="name" />
  <input name="phone" />
  <input name="email" />
  <textarea name="message"></textarea>
  <input type="hidden" name="traffic_source" />
  <input type="hidden" name="landing_url" />
</form>

<form name="join" data-netlify="true" hidden>
  <input type="hidden" name="form-name" value="join" />
  <input name="bot-field" />
  <input name="business_name" />
  <input name="contact_name" />
  <input name="phone" />
  <input name="email" />
  <input name="service_area" />
  <input name="years_in_business" />
  <input name="license" />
  <input name="insurance_summary" />
  <input name="certifications" />
  <textarea name="notes"></textarea>
  <input type="hidden" name="traffic_source" />
  <input type="hidden" name="landing_url" />
</form>

<form name="stickerrequest" data-netlify="true" hidden>
  <input type="hidden" name="form-name" value="stickerrequest" />
  <input name="bot-field" />
  <input name="business_name" />
  <input name="contact_name" />
  <input name="phone" />
  <input name="email" />
  <input name="shipping_address" />
  <input name="quantity" />
  <textarea name="notes"></textarea>
  <input type="hidden" name="traffic_source" />
  <input type="hidden" name="landing_url" />
</form>

</body>
</html>
